name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Build and start Docker image
        if: matrix.os == 'ubuntu-latest'
        run: |
          docker build -t private-directory-server:ci .
          docker run --detach --name private-directory-server-ci --publish 8000:8000 --env ACCESS_TOKEN=ci-verification-token-123456 --volume "$PWD/public:/shared:ro" private-directory-server:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs private-directory-server-ci
          exit 1
      - name: Stop Docker verification container
        if: always() && matrix.os == 'ubuntu-latest'
        run: docker rm --force private-directory-server-ci 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: private-directory-server
          path: release/private-directory-server
          if-no-files-found: error
