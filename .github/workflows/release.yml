name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Create archives
        run: |
          cd release
          tar -czf "private-directory-server-${GITHUB_REF_NAME}.tar.gz" private-directory-server
          zip -rq "private-directory-server-${GITHUB_REF_NAME}.zip" private-directory-server
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.zip --generate-notes --verify-tag
